<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Text Effect</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
        }
        
        .gradient-text {
            font-size: 6rem;
            font-weight: 900;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.3);
            animation: gradientMove 3s ease infinite, pulse 2s ease-in-out infinite;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            padding: 20px;
        }
        
        .gradient-text:hover {
            transform: scale(1.05);
            text-shadow: 0 5px 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 4px;
        }
        
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes pulse {
            0%, 100% { text-shadow: 0 2px 10px rgba(255, 255, 255, 0.3); }
            50% { text-shadow: 0 5px 25px rgba(255, 255, 255, 0.7); }
        }
    </style>
</head>
<body>
    <div class="gradient-text">GRADIENT</div>
</body>
</html>
